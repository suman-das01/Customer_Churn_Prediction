<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .churn {
            background: #fee2e2;
            color: #991b1b;
        }

        .no-churn {
            background: #dcfce7;
            color: #166534;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Customer Churn Prediction</h1>

        <p class="subtitle">
            Enter customer details to predict churn probability
        </p>

        <form id="churnForm">

            <div class="form-grid">

                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <!-- Senior Citizen -->
                <div class="form-group">
                    <label>Senior Citizen</label>
                    <select id="SeniorCitizen">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <!-- Partner -->
                <div class="form-group">
                    <label>Partner</label>
                    <select id="Partner">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Dependents -->
                <div class="form-group">
                    <label>Dependents</label>
                    <select id="Dependents">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Tenure -->
                <div class="form-group">
                    <label>Tenure (Months)</label>
                    <input type="number" id="tenure" value="12" min="0">
                </div>

                <!-- Phone Service -->
                <div class="form-group">
                    <label>Phone Service</label>
                    <select id="PhoneService">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Multiple Lines -->
                <div class="form-group">
                    <label>Multiple Lines</label>
                    <select id="MultipleLines">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No phone service">No phone service</option>
                    </select>
                </div>

                <!-- Internet Service -->
                <div class="form-group">
                    <label>Internet Service</label>
                    <select id="InternetService">
                        <option value="DSL">DSL</option>
                        <option value="Fiber optic">Fiber optic</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Online Security -->
                <div class="form-group">
                    <label>Online Security</label>
                    <select id="OnlineSecurity">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <!-- Online Backup -->
                <div class="form-group">
                    <label>Online Backup</label>
                    <select id="OnlineBackup">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <!-- Device Protection -->
                <div class="form-group">
                    <label>Device Protection</label>
                    <select id="DeviceProtection">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <!-- Tech Support -->
                <div class="form-group">
                    <label>Tech Support</label>
                    <select id="TechSupport">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <!-- Streaming TV -->
                <div class="form-group">
                    <label>Streaming TV</label>
                    <select id="StreamingTV">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <!-- Streaming Movies -->
                <div class="form-group">
                    <label>Streaming Movies</label>
                    <select id="StreamingMovies">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <!-- Contract -->
                <div class="form-group">
                    <label>Contract</label>
                    <select id="Contract">
                        <option value="Month-to-month">Month-to-month</option>
                        <option value="One year">One year</option>
                        <option value="Two year">Two year</option>
                    </select>
                </div>

                <!-- Paperless Billing -->
                <div class="form-group">
                    <label>Paperless Billing</label>
                    <select id="PaperlessBilling">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <!-- Payment Method -->
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="PaymentMethod">
                        <option value="Electronic check">Electronic check</option>
                        <option value="Mailed check">Mailed check</option>
                        <option value="Bank transfer (automatic)">
                            Bank transfer (automatic)
                        </option>
                        <option value="Credit card (automatic)">
                            Credit card (automatic)
                        </option>
                    </select>
                </div>

                <!-- Monthly Charges -->
                <div class="form-group">
                    <label>Monthly Charges</label>
                    <input type="number" id="MonthlyCharges" value="70" step="0.01">
                </div>

                <!-- Total Charges -->
                <div class="form-group">
                    <label>Total Charges</label>
                    <input type="number" id="TotalCharges" value="840" step="0.01">
                </div>

            </div>

            <button type="submit">
                Predict Churn
            </button>

        </form>

        <div id="result"></div>

    </div>

</div>


<script>

document.getElementById("churnForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const data = {

        gender: document.getElementById("gender").value,

        SeniorCitizen:
            Number(document.getElementById("SeniorCitizen").value),

        Partner: document.getElementById("Partner").value,

        Dependents: document.getElementById("Dependents").value,

        tenure:
            Number(document.getElementById("tenure").value),

        PhoneService:
            document.getElementById("PhoneService").value,

        MultipleLines:
            document.getElementById("MultipleLines").value,

        InternetService:
            document.getElementById("InternetService").value,

        OnlineSecurity:
            document.getElementById("OnlineSecurity").value,

        OnlineBackup:
            document.getElementById("OnlineBackup").value,

        DeviceProtection:
            document.getElementById("DeviceProtection").value,

        TechSupport:
            document.getElementById("TechSupport").value,

        StreamingTV:
            document.getElementById("StreamingTV").value,

        StreamingMovies:
            document.getElementById("StreamingMovies").value,

        Contract:
            document.getElementById("Contract").value,

        PaperlessBilling:
            document.getElementById("PaperlessBilling").value,

        PaymentMethod:
            document.getElementById("PaymentMethod").value,

        MonthlyCharges:
            Number(document.getElementById("MonthlyCharges").value),

        TotalCharges:
            Number(document.getElementById("TotalCharges").value)
    };


    try {

        const response = await fetch("/predict", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(data)

        });


        const result = await response.json();

        const resultBox = document.getElementById("result");

        const probability =
            (result.churn_probability * 100).toFixed(2);


        if (result.prediction === 1) {

            resultBox.className = "churn";

            resultBox.innerHTML =
                `<h2>⚠️ Customer Likely to Churn</h2>
                 <p>Churn Probability: <strong>${probability}%</strong></p>`;

        } else {

            resultBox.className = "no-churn";

            resultBox.innerHTML =
                `<h2>✅ Customer Likely to Stay</h2>
                 <p>Churn Probability: <strong>${probability}%</strong></p>`;

        }

        resultBox.style.display = "block";

    }

    catch (error) {

        const resultBox = document.getElementById("result");

        resultBox.className = "churn";

        resultBox.innerHTML =
            "<h3>Something went wrong. Please try again.</h3>";

        resultBox.style.display = "block";

        console.error(error);
    }

});

</script>

</body>
</html>
